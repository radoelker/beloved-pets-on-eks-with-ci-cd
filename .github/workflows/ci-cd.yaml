name: EKS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: radoelker
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: spot-eks-prd-rainer
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/voting-app:${{ env.IMAGE_TAG }}

      - name: Build and push result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/result-app:${{ env.IMAGE_TAG }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/worker-app:${{ env.IMAGE_TAG }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}


      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION

      - name: Deploy Kubernetes manifests
        run: |
          kubectl set image deployment/worker-deployment worker=${{ env.DOCKERHUB_USERNAME }}/worker-app:${{ env.IMAGE_TAG }}
          kubectl set image deployment/result-app result= ${{ env.DOCKERHUB_USERNAME }}/result-app:${{ env.IMAGE_TAG }}
          kubectl set image deployment/vote-app vote=${{ env.DOCKERHUB_USERNAME }}/voting-app:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/worker-deployment
          kubectl rollout status deployment/result-app      
          kubectl rollout status deployment/vote-app