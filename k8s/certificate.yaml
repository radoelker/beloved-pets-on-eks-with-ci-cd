---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: beloved-tls
spec:
  # The name of the Secret cert-manager will create.
  # The Gateway's TLS listener references this exact name.
  secretName: beloved-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames: 
    - beloved-pets.rainer.ironlabs.online
    - vote.beloved-pets.rainer.ironlabs.online
    - result.beloved-pets.rainer.ironlabs.online
