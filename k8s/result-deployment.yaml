apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "1"
  creationTimestamp: "2026-05-08T12:00:00Z"
  generation: 1
  name: result-app 
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-app
  strategy: 
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: result-app
    spec:
      containers:
      - name: result-app
        image: radoelker/result-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http-80-result
        env:
          - name: PG_HOST
            value: "postgres-service-clusterip"
          - name: PG_PORT
            value: "5432"
          - name: PG_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: PG_DATABASE
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_DB
      restartPolicy: Always
